name: cineholmes
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # Firebase & Auth
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  shared_preferences: ^2.2.2
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.0
  flutter_facebook_auth: ^7.1.0
  cloud_firestore: ^5.4.4
  url_launcher: ^6.3.0

  # UI & Icons
  font_awesome_flutter: ^10.7.0
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1

  # Environment & API Tools
  flutter_dotenv: ^5.1.0
  http: ^1.1.0
  crypto: ^3.0.3
  logging: ^1.2.0
  http_parser: ^4.0.2

  # Media Pickers
  image_picker: ^1.2.0
  file_picker: ^8.1.2 # Video/ses dosyası seçimi için

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/app.png"

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/avatars/
    - assets/images/app.png

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-Light.ttf
          weight: 300
        - asset: assets/fonts/Nunito-Medium.ttf
          weight: 500
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
    - family: Digital7
      fonts:
        - asset: assets/fonts/digital-7.ttf
